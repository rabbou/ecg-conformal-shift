name: gates

# The same three gates as .pre-commit-config.yaml, on the pushed state.
# A local hook can be skipped with --no-verify or by committing from a tool
# that never installed it; this cannot.
on:
  push:
    branches: ["master", "report/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # requires-python in pyproject.toml is >=3.11,<3.12.
      - run: uv python install 3.11

      # --locked so CI fails on a uv.lock that no longer matches pyproject.toml
      # rather than quietly resolving something else.
      - run: uv sync --locked --all-extras --dev

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests scripts

      # -m "not data" is the pre-push hook's selection: the rest needs corpora
      # that are not in the repository and are not downloadable here.
      - run: uv run pytest -q -m "not data"
