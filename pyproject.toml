[project]
name = "ecg-conformal-shift"
version = "0.1.0"
description = "Does a conformal coverage guarantee survive a change of hospital? Measured on 12-lead ECG."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "torch==2.2.2",
    "wfdb>=4.1",
    "h5py>=3.11",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
encoders = [
    "transformers>=4.38,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecs"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pre-commit", "pandas-stubs", "types-tqdm"]

[tool.ruff]
line-length = 100
target-version = "py311"
# third_party is upstream code kept as published.  .claude is a local scratch
# directory that may hold git worktrees of this repository, whose copies of
# these same files would otherwise be linted and reformatted from here.
extend-exclude = ["third_party", ".claude"]
force-exclude = true  # also when a hook passes the path explicitly

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["data: needs the ECG corpora on disk"]
